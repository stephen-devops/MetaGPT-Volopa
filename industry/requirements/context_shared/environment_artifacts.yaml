  msc_upload_csv:
    source_slide: 12
    name: "Upload CSV Sequence"
    components:
      - name: "Oauth2UserClient (MW)"
        origin: EXISTING
        dimension: "Flow"
        type: "Middleware"
        description: "Authentication gateway - validates OAuth2 tokens before allowing requests to proceed"

      - name: "Storage(mass_file_uploads)"
        origin: EXISTING
        dimension: "Flow"
        type: "File Storage"
        description: "Persistent file storage for uploaded CSV files"

      - name: "PaymentFileUpload (DB)"
        origin: NEW
        dimension: "Flow"
        type: "Database"
        location: "app/Models/PaymentFileUpload.php"
        description: "Database table tracking uploaded payment files and their processing status"

      - name: "Queue(file-processing)"
